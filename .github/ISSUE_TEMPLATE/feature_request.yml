name: Feature Request
description: Suggest an idea or enhancement for the app
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make the Nissan Connect app better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which part of the app does this relate to?
      options:
        - Climate Control
        - Charging & Battery
        - Location / GPS
        - Flow Cards / Automation
        - New Vehicle Support
        - Other
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: Target Vehicle (if applicable)
      description: e.g. Nissan Ariya, Leaf ZE1
      placeholder: All models
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
